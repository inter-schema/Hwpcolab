[workspace]
members = [
    "crates/*",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.2.3"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["HOP-Claw Team"]

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.22.1"
bytes = "1.12.1"
cfb = "0.14.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.10"
fontdb = "0.23.0"
hex = "0.4.3"
http = "1.5.0"
http-body-util = "0.1.5"
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "io-util", "fs", "sync", "macros", "rt-multi-thread", "net", "time"] }
tower = "0.5.3"
tower-http = "0.6.11"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicase = "2.10.0"
unicode-normalization = "0.1.26"
uuid = { version = "1.29.0", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

hopclaw-types = { path = "crates/hopclaw-types" }
hopclaw-devbridge = { path = "crates/hopclaw-devbridge" }
