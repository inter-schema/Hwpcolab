[package]
name = "hopclaw-hwpx"
version = "0.2.3"
edition = "2021"
license = "GPL-3.0-or-later"
description = "OWPML (.hwpx) package validator and quick-xml selective editor for HOP-Claw"

[dependencies]
quick-xml = "0.42.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
unicase = "2.10.0"
unicode-normalization = "0.1.26"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
